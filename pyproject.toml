[project]
name = "agentic-locomanip"
version = "0.1.0"
description = "Agentic loco-manipulation: a local VLM plans a wheel-legged mobile manipulator (LimX TRON2 WFYG) in MuJoCo by calling robot tools"
readme = "README.md"
authors = [
    { name = "supat-roong", email = "roongpraiwan.supat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.38.2",
    "imageio-ffmpeg>=0.8.1",
    "mujoco>=4.0.1",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "onnxruntime>=1.32.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
agentic-locomanip = "agentic_locomanip.cli:main"

[tool.ruff]
line-length = 120
extend-exclude = ["tools/kaggle/notebook"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
