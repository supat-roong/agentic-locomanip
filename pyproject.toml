[project]
name = "tron2-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "supat-roong", email = "roongpraiwan.supat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mujoco>=4.0.1",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "onnxruntime>=1.32.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
